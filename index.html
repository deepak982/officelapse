<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>officelapse</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#0b0d13;--panel:#131723;--line:#232838;--ink:#e7eaf3;--dim:#7b8299;--accent:#7dd3fc}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;flex:0 0 auto;
    border-bottom:1px solid var(--line);background:#101420;z-index:4}
  h1{font-size:14px;margin:0;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  .stat{color:var(--dim);font-size:12px;white-space:nowrap}
  .stat b{color:var(--ink);font-weight:600}
  .pulse{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;margin-right:5px}
  .pulse.on{background:#22c55e;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .spacer{flex:1}
  #q{background:#1a1f2e;border:1px solid #313850;border-radius:6px;color:var(--ink);
    font:inherit;font-size:12px;padding:6px 11px;width:250px;outline:none}
  #q:focus{border-color:var(--accent)}
  #q::placeholder{color:#565d72}
  #hits{color:var(--accent);font-size:11px;min-width:54px}

  #stage{position:relative;flex:1;overflow:hidden}
  canvas{width:100%;height:100%;display:block}
  .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);
    pointer-events:none;text-align:center;padding:0 12%;line-height:1.7;max-width:100%}
  .empty.bad{color:#fbbf24}
  .hint{position:absolute;left:16px;bottom:12px;color:#474d60;font-size:11px;pointer-events:none}

  /* ---- speech bubbles: real DOM, so they can be hovered and pinned ---- */
  #bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  .bub{position:absolute;left:0;top:0;max-width:250px;pointer-events:auto;cursor:pointer;
    background:#f4f7fc;color:#14171f;border-radius:10px;padding:6px 10px;font-size:11.5px;
    line-height:1.35;box-shadow:0 6px 18px #000a;opacity:0;visibility:hidden;
    transition:opacity .18s ease,visibility .18s;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .bub.on{opacity:1;visibility:visible}
  .bub.in{animation:pop .24s cubic-bezier(.34,1.4,.5,1)}
  @keyframes pop{from{transform:translate(-50%,-100%) scale(.82)}to{}}
  .bub i{font-style:normal;font-weight:700;color:#5b6478;margin-right:6px;font-size:10px}
  .bub::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;
    border:5px solid transparent;border-top-color:#f4f7fc;border-bottom:0}
  .bub:hover{box-shadow:0 8px 24px #000c}
  .bub.task{background:#fde68a}.bub.task::after{border-top-color:#fde68a}
  .bub.pin{background:#bae6fd;box-shadow:0 0 0 2px var(--accent),0 8px 24px #000c}
  .bub.pin::after{border-top-color:#bae6fd}

  /* ---- hover card ---- */
  /* docked, never under the cursor — a floating card hides what you are inspecting */
  #tip{position:absolute;left:14px;bottom:34px;z-index:5;pointer-events:none;width:300px;
    background:rgba(13,17,26,.94);border:1px solid #2d3448;border-radius:8px;padding:9px 11px;
    box-shadow:0 10px 30px #0009;opacity:0;transition:opacity .12s;
    backdrop-filter:blur(3px)}
  #tip.on{opacity:1}
  #tip .tk{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#616a80}
  #tip h3{margin:2px 0 6px;font-size:13px;font-weight:600;line-height:1.3;word-break:break-word}
  #tip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:10.5px}
  #tip dt{color:#616a80;white-space:nowrap}
  #tip dd{margin:0;color:#cfd6e6;word-break:break-all}
  #tip .now{margin-top:7px;padding-top:7px;border-top:1px solid #262d3f;font-size:11px;color:var(--accent)}

  #panel{position:absolute;top:0;right:0;bottom:0;width:360px;background:var(--panel);
    border-left:1px solid var(--line);transform:translateX(100%);
    transition:transform .32s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:3}
  #panel.open{transform:none}
  .ph{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .ph h2{margin:0;font-size:13px;letter-spacing:.04em}
  .ph p{margin:3px 0 0;font-size:11px;color:var(--dim)}
  #close{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}
  #plist{overflow:auto;padding:5px 0;flex:0 0 auto;max-height:38%;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:9px;padding:7px 16px;align-items:flex-start}
  .row.boss{background:#161b29}
  .row.kid{padding-left:30px;position:relative}
  .row.kid::before{content:"└";position:absolute;left:16px;top:6px;color:#3b4258;font-size:11px}
  .row.off{opacity:.45}
  .sw{width:9px;height:9px;border-radius:2px;margin-top:4px;flex:0 0 auto}
  .rt{min-width:0;flex:1}
  .rt b{display:block;font-size:12px;font-weight:600}
  .rt span,.rt i{display:block;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rt span{color:var(--dim)}
  .rt i{color:var(--accent);font-style:normal;margin-top:2px}

  /* ---- room chat log ---- */
  .lh{padding:9px 16px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5b6478}
  #chatwrap{position:relative;flex:1;min-height:0}
  #chatlog{position:absolute;inset:0;overflow-y:auto;padding:0 14px 14px}
  .msg{display:flex;gap:8px;padding:5px 2px;align-items:flex-start}
  .msg.boss{background:#161b29;border-radius:6px;padding:5px 6px}
  .msg:not(.boss){padding-left:18px}
  .av{width:8px;height:8px;border-radius:2px;margin-top:5px;flex:0 0 auto}
  .mb{min-width:0;flex:1}
  .mb b{font-size:10.5px;font-weight:700;color:#98a1b7;display:block}
  .mb b em{font-style:normal;color:#4e5568;font-weight:400;margin-left:7px;font-size:10px}
  .mb p{margin:1px 0 0;font-size:11.5px;word-break:break-word}
  .msg.task .mb p{color:#fde68a}
  .msg.empty{color:var(--dim);justify-content:center;padding:20px}
  #jump{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(8px);
    background:var(--accent);color:#0b0e15;border:0;border-radius:99px;padding:4px 12px;
    font:inherit;font-size:11px;font-weight:600;cursor:pointer;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s}
  #jump.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}

  footer{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:9px 16px;
    border-top:1px solid var(--line);background:#101420}
  button{background:#212636;color:var(--ink);border:1px solid #333a52;border-radius:5px;
    padding:5px 11px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#2a3044}
  button.on{background:var(--accent);color:#0b0e15;border-color:var(--accent);font-weight:600}
  #ff{color:#f59e0b;font-size:11px;opacity:0;transition:opacity .2s;white-space:nowrap}
  #ff.on{opacity:1}
  #scrub{flex:1;accent-color:var(--accent);cursor:pointer}
  #clock{color:var(--dim);font-variant-numeric:tabular-nums;min-width:112px;text-align:right}
</style>
</head>
<body>
<header>
  <h1>officelapse</h1>
  <span class="stat"><span id="dot" class="pulse"></span><b id="nactive">0</b> working</span>
  <span class="stat"><b id="nteam">0</b> rooms</span>
  <span class="stat"><b id="nsub">0</b> teammates</span>
  <span class="spacer"></span>
  <input id="q" placeholder="search department, boss, teammate, task…" autocomplete="off">
  <span id="hits"></span>
  <button id="fit">Fit</button>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="bubbles"></div>
  <div class="empty" id="empty">no sessions in the window — start a Claude session and watch</div>
  <div id="tip"></div>
  <div class="hint">hover anyone for detail · click a room to step inside · drag to pan · scroll to zoom · <b>/</b> to search · esc to back out</div>
  <aside id="panel">
    <div class="ph">
      <div><h2 id="pname">—</h2><p id="pmeta"></p></div>
      <button id="close">✕</button>
    </div>
    <div id="plist"></div>
    <div class="lh">Room chat</div>
    <div id="chatwrap"><div id="chatlog"></div><button id="jump">jump to live ↓</button></div>
  </aside>
</div>

<footer>
  <button id="play">⏸</button>
  <button id="live" class="on">● LIVE</button>
  <input id="scrub" type="range" min="0" max="1000" value="1000">
  <button id="speed">1×</button>
  <span id="ff">▶▶ fast-forward: walks skipped</span>
  <span id="clock">--:--:--</span>
</footer>
<script src="floor.js"></script>
<script src="chat.js"></script>
<script src="office.js"></script>
</body>
</html>
